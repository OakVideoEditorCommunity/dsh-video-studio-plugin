name: build-and-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '构建版本号（workflow_dispatch 只构建产物，不打 tag/不发布）'
        required: false
        default: '0.0.0-dev'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: OakVideoEditorCommunity/example-mcp
  UPSTREAM_REF: 9a58b3b57874659f9213b3e191e6be3df1726f92

jobs:
  linux-x64:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Checkout upstream example-mcp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream-src
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev cmake ninja-build pkg-config pkgconf \
            perl python3 curl ca-certificates git xz-utils bzip2 tar patch nasm yasm \
            meson autoconf autoconf-archive automake libtool gperf zip unzip \
            libnuma-dev zlib1g-dev \
            libpipewire-0.3-dev libjack-jackd2-dev libasound2-dev libpulse-dev libsndfile1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libudev-dev \
            libgl-dev libglvnd-dev libgl1-mesa-dev libegl-dev \
            libfontconfig1-dev libfreetype-dev \
            libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri libegl1 libgl1 libglx-mesa0 mesa-utils xvfb
      - name: Restore quercus FFmpeg bootstrap prefix
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/oak-build/quercus-ffmpeg/ffmpeg
          key: quercus-ffmpeg-linux-x64-v1
      - name: Build oak-mcp
        env:
          UPSTREAM_SRC: ${{ github.workspace }}/upstream-src
          WORK_ROOT: ${{ runner.temp }}/oak-build
          OUT_DIR: ${{ runner.temp }}/oak-build/out/linux-x64
        run: bash ci/build-linux.sh
      - name: Save quercus FFmpeg bootstrap prefix
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/oak-build/quercus-ffmpeg/ffmpeg
          key: quercus-ffmpeg-linux-x64-v1
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: ${{ runner.temp }}/oak-build/out/linux-x64
          if-no-files-found: error

  windows-x64:
    name: Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Checkout upstream example-mcp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream-src
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Restore quercus vcpkg FFmpeg prefix
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/oak-build/quercus-ffmpeg/vcpkg/installed
          key: quercus-ffmpeg-win64-vcpkg-v1
      - name: Build oak-mcp
        shell: pwsh
        env:
          UPSTREAM_SRC: ${{ github.workspace }}\upstream-src
          WORK_ROOT: ${{ runner.temp }}\oak-build
          OUT_DIR: ${{ runner.temp }}\oak-build\out\windows-x64
        run: |
          $ffmpeg = ($env:FFMPEG_DIR -replace '\\','\\')
          "FFMPEG_DIR=$env:FFMPEG_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append
          ./ci/build-windows.ps1
      - name: Save quercus vcpkg FFmpeg prefix
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/oak-build/quercus-ffmpeg/vcpkg/installed
          key: quercus-ffmpeg-win64-vcpkg-v1
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ${{ runner.temp }}/oak-build/out/windows-x64
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Checkout upstream example-mcp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream-src
      - name: Restore quercus FFmpeg bootstrap prefix
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/oak-build/quercus-ffmpeg/ffmpeg
          key: quercus-ffmpeg-macos-arm64-v1
      - name: Build oak-mcp
        env:
          UPSTREAM_SRC: ${{ github.workspace }}/upstream-src
          WORK_ROOT: ${{ runner.temp }}/oak-build
          OUT_DIR: ${{ runner.temp }}/oak-build/out/macos-arm64
        run: bash ci/build-macos.sh
      - name: Save quercus FFmpeg bootstrap prefix
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/oak-build/quercus-ffmpeg/ffmpeg
          key: quercus-ffmpeg-macos-arm64-v1
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: ${{ runner.temp }}/oak-build/out/macos-arm64
          if-no-files-found: error

  release:
    name: Package / release / npm publish
    needs: [linux-x64, windows-x64, macos-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: ${{ runner.temp }}/artifacts/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: ${{ runner.temp }}/artifacts/windows-x64
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: ${{ runner.temp }}/artifacts/macos-arm64
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Package plugin + MCP release artifacts
        shell: bash
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/artifacts"
          bash cross-build/package-plugins.sh \
            --plugin-src plugin \
            --version "$VERSION" \
            --linux-binary "$A/linux-x64/bin/oak-mcp" --linux-libs "$A/linux-x64/lib" \
            --windows-binary "$A/windows-x64/oak-mcp.exe" --windows-dlls "$A/windows-x64" \
            --macos-binary "$A/macos-arm64/bin/oak-mcp" --macos-libs "$A/macos-arm64/lib"
          bash cross-build/package-mcp.sh \
            --version "$VERSION" \
            --linux-binary "$A/linux-x64/bin/oak-mcp" --linux-libs "$A/linux-x64/lib" \
            --windows-binary "$A/windows-x64/oak-mcp.exe" --windows-dlls "$A/windows-x64" \
            --macos-binary "$A/macos-arm64/bin/oak-mcp" --macos-libs "$A/macos-arm64/lib"
          (cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaged
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: '${{ env.VERSION }}'
          body_path: .github/release-notes.md
          files: |
            dist/video-studio-*.tar.gz
            dist/video-studio-*.zip
            dist/oak-mcp-*.tar.gz
            dist/oak-mcp-*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
      - name: Setup Node for npm
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm (trusted publishing / provenance support)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm install -g npm@latest
      - name: Assemble npm packages
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/artifacts"
          bash cross-build/package-npm.sh \
            --plugin-src plugin --version "$VERSION" --out "$RUNNER_TEMP/npm" \
            --linux-binary "$A/linux-x64/bin/oak-mcp" --linux-libs "$A/linux-x64/lib" \
            --windows-binary "$A/windows-x64/oak-mcp.exe" --windows-dlls "$A/windows-x64" \
            --macos-binary "$A/macos-arm64/bin/oak-mcp" --macos-libs "$A/macos-arm64/lib"
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          set -euo pipefail
          for pkg in oak-mcp-darwin-arm64 oak-mcp-linux-x64 oak-mcp-win32-x64 oak-mcp oak-deepseek-plugin; do
            NAME=$(node -p "require('$RUNNER_TEMP/npm/$pkg/package.json').name")
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "==> $NAME@$VERSION already published, skipping"
              continue
            fi
            echo "==> npm publish $NAME@$VERSION"
            (cd "$RUNNER_TEMP/npm/$pkg" && npm publish --access public --provenance)
          done
