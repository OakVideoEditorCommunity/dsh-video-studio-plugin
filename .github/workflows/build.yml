name: build-and-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '构建版本号（workflow_dispatch 只构建产物，不打 tag/不发布）'
        required: false
        default: '0.0.0-dev'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: OakVideoEditorCommunity/example-mcp
  UPSTREAM_REF: 9a58b3b57874659f9213b3e191e6be3df1726f92

jobs:
  linux-x64:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout upstream example-mcp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream-src
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev cmake ninja-build pkg-config pkgconf \
            perl python3 curl ca-certificates git xz-utils nasm yasm zip unzip \
            zlib1g-dev libbz2-dev liblzma-dev libnuma-dev \
            libx264-dev libx265-dev libvpx-dev libdav1d-dev libopus-dev \
            libvorbis-dev libtheora-dev libmp3lame-dev libspeex-dev \
            libopenjp2-7-dev libwebp-dev libsnappy-dev \
            libfreetype-dev libfontconfig1-dev libfribidi-dev libass-dev \
            libpipewire-0.3-dev libjack-jackd2-dev libasound2-dev libpulse-dev libsndfile1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libudev-dev \
            libgl-dev libglvnd-dev libgl1-mesa-dev libegl-dev \
            libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri libegl1 libgl1 libglx-mesa0 mesa-utils xvfb
      - name: Cache FFmpeg 9
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/oak-build/ffmpeg9
          key: ffmpeg9-linux-x64-${{ hashFiles('ci/build-ffmpeg9-linux.sh') }}
      - name: Build oak-mcp
        env:
          UPSTREAM_SRC: ${{ github.workspace }}/upstream-src
          WORK_ROOT: ${{ runner.temp }}/oak-build
          OUT_DIR: ${{ runner.temp }}/oak-build/out/linux-x64
        run: bash ci/build-linux.sh
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: ${{ runner.temp }}/oak-build/out/linux-x64
          if-no-files-found: error

  windows-x64:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout upstream example-mcp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream-src
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Download FFmpeg 9 (BtbN shared, MSVC)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg9.zip'
          $prefix = Join-Path $env:RUNNER_TEMP 'oak-build\ffmpeg9'
          if (-not (Test-Path (Join-Path $prefix 'include'))) {
            Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip' -OutFile $zip
            $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg9-extract'
            Expand-Archive -Path $zip -DestinationPath $extract -Force
            $inner = Get-ChildItem $extract -Directory | Select-Object -First 1
            New-Item -ItemType Directory -Force -Path (Split-Path $prefix) | Out-Null
            Move-Item $inner.FullName $prefix
          }
          "FFMPEG_DIR=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build oak-mcp
        shell: pwsh
        env:
          UPSTREAM_SRC: ${{ github.workspace }}\upstream-src
          WORK_ROOT: ${{ runner.temp }}\oak-build
          OUT_DIR: ${{ runner.temp }}\oak-build\out\windows-x64
        run: |
          $ffmpeg = ($env:FFMPEG_DIR -replace '\\','\\')
          "FFMPEG_DIR=$env:FFMPEG_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append
          ./ci/build-windows.ps1
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ${{ runner.temp }}/oak-build/out/windows-x64
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Checkout upstream example-mcp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream-src
      - name: Build oak-mcp
        env:
          UPSTREAM_SRC: ${{ github.workspace }}/upstream-src
          WORK_ROOT: ${{ runner.temp }}/oak-build
          OUT_DIR: ${{ runner.temp }}/oak-build/out/macos-arm64
        run: bash ci/build-macos.sh
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: ${{ runner.temp }}/oak-build/out/macos-arm64
          if-no-files-found: error

  release:
    name: Package / release / npm publish
    needs: [linux-x64, windows-x64, macos-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: ${{ runner.temp }}/artifacts/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: ${{ runner.temp }}/artifacts/windows-x64
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: ${{ runner.temp }}/artifacts/macos-arm64
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Package plugin + MCP release artifacts
        shell: bash
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/artifacts"
          bash cross-build/package-plugins.sh \
            --plugin-src plugin \
            --version "$VERSION" \
            --linux-binary "$A/linux-x64/bin/oak-mcp" --linux-libs "$A/linux-x64/lib" \
            --windows-binary "$A/windows-x64/oak-mcp.exe" --windows-dlls "$A/windows-x64" \
            --macos-binary "$A/macos-arm64/bin/oak-mcp" --macos-libs "$A/macos-arm64/lib"
          bash cross-build/package-mcp.sh \
            --version "$VERSION" \
            --linux-binary "$A/linux-x64/bin/oak-mcp" --linux-libs "$A/linux-x64/lib" \
            --windows-binary "$A/windows-x64/oak-mcp.exe" --windows-dlls "$A/windows-x64" \
            --macos-binary "$A/macos-arm64/bin/oak-mcp" --macos-libs "$A/macos-arm64/lib"
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaged
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: '${{ env.VERSION }}'
          body_path: .github/release-notes.md
          files: |
            dist/video-studio-*.tar.gz
            dist/video-studio-*.zip
            dist/oak-mcp-*.tar.gz
            dist/oak-mcp-*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
      - name: Setup Node for npm
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Assemble npm packages
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/artifacts"
          bash cross-build/package-npm.sh \
            --plugin-src plugin --version "$VERSION" --out "$RUNNER_TEMP/npm" \
            --linux-binary "$A/linux-x64/bin/oak-mcp" --linux-libs "$A/linux-x64/lib" \
            --windows-binary "$A/windows-x64/oak-mcp.exe" --windows-dlls "$A/windows-x64" \
            --macos-binary "$A/macos-arm64/bin/oak-mcp" --macos-libs "$A/macos-arm64/lib"
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v') && secrets.NPM_TOKEN != ''
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          set -euo pipefail
          for pkg in oak-mcp-darwin-arm64 oak-mcp-linux-x64 oak-mcp-win32-x64 oak-mcp oak-deepseek-plugin; do
            echo "==> npm publish $pkg"
            (cd "$RUNNER_TEMP/npm/$pkg" && npm publish --access public)
          done
