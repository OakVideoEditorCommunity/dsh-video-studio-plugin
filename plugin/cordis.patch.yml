# video-studio bundle patch — 通用版（Windows / Linux / macOS）
#
# MCP 二进制位置（可用环境变量 VIDEO_STUDIO_MCP_BIN 覆盖）：
#   Windows: %LOCALAPPDATA%\video-studio\oak-mcp.exe
#   Linux/macOS: ~/.local/share/video-studio/oak-mcp
# install.sh / install.ps1 会把 oak-mcp 放到上述目录。
# 预览目录不配置：插件默认使用 ~/.dsh/video-studio/previews。

- insert:
    - id: video-studio-oak-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: oak
        transport: stdio
        command: !!js "process.env.VIDEO_STUDIO_MCP_BIN || (process.platform === 'win32' ? ((process.env.LOCALAPPDATA || (process.env.USERPROFILE + '/AppData/Local')) + '/video-studio/oak-mcp.exe') : ((process.env.HOME || process.env.USERPROFILE) + '/.local/share/video-studio/oak-mcp'))"
        toolCallTimeoutMs: 180000
        failOnStartupError: false

    - id: video-studio
      name: '@local/video-studio'
